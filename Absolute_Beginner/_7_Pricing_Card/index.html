<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

    <div class="cards">
        <div>
            <h1>Free Plan</h1>
            <p>For Personal</p>
            <h1 class="cost">$0</h1>
            <p><i class="fa-solid fa-square-check"></i>1 User</p>
            <p><i class="fa-solid fa-square-check"></i>4 Web Mails</p>
            <p><i class="fa-solid fa-square-check"></i>Responsive Website</p>
            <p><i class="fa-solid fa-square-check"></i>Free SSL</p>
            <button>Subcribe Now</button>
        </div>
        <div class="theme">
            <h1>Basic Plan</h1>
            <p>For Small Business</p>
            <h1 class="cost">$29</h1>
            <p><i class="fa-solid fa-square-check"></i>4 User</p>
            <p><i class="fa-solid fa-square-check"></i>10 Web Mails</p>
            <p><i class="fa-solid fa-square-check"></i>Responsive Website</p>
            <p><i class="fa-solid fa-square-check"></i>Free SSL</p>
            <button>Subcribe Now</button>
        </div>
        <div>
            <h1>Pro Plan</h1>
            <p>For Enterprice</p>
            <h1 class="cost">$49</h1>
            <p><i class="fa-solid fa-square-check"></i>unlimited User</p>
            <p><i class="fa-solid fa-square-check"></i>unlimited Web Mails</p>
            <p><i class="fa-solid fa-square-check"></i>Responsive Website</p>
            <p><i class="fa-solid fa-square-check"></i>Free SSL + SEO</p>
            <button>Subcribe Now</button>
        </div>
      
    </div>
</body>
</html>
